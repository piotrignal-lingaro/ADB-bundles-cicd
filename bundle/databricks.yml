# Declarative Automation Bundle configuration, more info here: https://docs.databricks.com/en/dev-tools/bundles/settings.html
bundle:
  name: "bundle"

include:
  - resources/*.yml
  - resources/*/*.yml

targets:
  # The 'dev' target, for development purposes. This target is the default.
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405617546769754.14.azuredatabricks.net

  # The 'prod' target, used for production deployment.
  prod:
    mode: production
    workspace:
      host: https://adb-7405613834408420.0.azuredatabricks.net
      # We always use /Users/piotr.ignal@lingarogroup.com for all resources to make sure we only have a single copy.
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
    run_as:
      # This runs as piotr.ignal@lingarogroup.com in production. We could also use a service principal here,
      # see https://docs.databricks.com/dev-tools/bundles/permissions.html.
      user_name: piotr.ignal@lingarogroup.com
